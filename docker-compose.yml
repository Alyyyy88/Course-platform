services:
  postgres:
    image: postgres:16-alpine
    container_name: course_platform_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: course_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - course_platform_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d course_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: course_platform_backend
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/course_platform
      JWT_SECRET: changeme_supersecret_jwt_key
      PORT: 4000
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: course_platform_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  course_platform_data:
